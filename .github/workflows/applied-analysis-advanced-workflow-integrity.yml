name: Advanced Applied Analysis Workflow Integrity

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src-tauri/resources/ui/physical_lab_applied_analysis_advanced_ui.py'
      - '.github/workflows/applied-analysis-advanced-workflow-integrity.yml'

jobs:
  staged-workflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Advanced Applied Analysis UI
        run: python -m py_compile src-tauri/resources/ui/physical_lab_applied_analysis_advanced_ui.py
      - name: Verify staged Advanced Applied Analysis workflow
        shell: bash
        run: |
          set -euo pipefail
          file='src-tauri/resources/ui/physical_lab_applied_analysis_advanced_ui.py'
          grep -q 'Advanced analysis task' "$file"
          grep -q 'pl_adv_task_' "$file"
          grep -q 'Screening method' "$file"
          grep -q 'pl_adv_screening_method_' "$file"
          grep -q 'Robust Regression' "$file"
          grep -q 'Model Selection' "$file"
          grep -q 'Factorial + Morris' "$file"
          grep -q 'DOE → Sweep' "$file"
          grep -q 'Two-level factorial effects' "$file"
          grep -q 'Morris design' "$file"
          grep -q 'Morris effects' "$file"
          if grep -q 'st.tabs' "$file"; then
            echo '::error::Advanced Applied Analysis must not use eager st.tabs navigation.'
            exit 1
          fi
