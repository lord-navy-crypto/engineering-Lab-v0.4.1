name: Engineering Lab Applied Analysis Integrity

on:
  workflow_dispatch:
  push:
    branches:
      - feature/expand-physics-simulation-scenarios
    paths:
      - 'src-tauri/resources/ui/physical_lab_applied_analysis.py'
      - 'src-tauri/resources/ui/physical_lab_applied_analysis_ui.py'
      - 'src-tauri/resources/ui/physical_lab_applied_analysis_advanced.py'
      - 'src-tauri/resources/ui/physical_lab_applied_analysis_advanced_ui.py'
      - 'src-tauri/resources/ui/physical_lab_applied_math_deep.py'
      - 'src-tauri/resources/ui/physical_lab_applied_math_deep_ui.py'
      - 'src-tauri/resources/ui/physical_lab_utube_experiment.py'
      - 'src-tauri/resources/ui/physical_lab_utube_experiment_ui.py'
      - 'src-tauri/resources/ui/physical_lab_sweep_executor.py'
      - 'src-tauri/resources/ui/physical_lab_sweep_design_bridge.py'
      - 'src-tauri/resources/ui/physical_lab_sweep_design_bridge_ui.py'
      - 'src-tauri/resources/ui/physical_lab_visualization_studio.py'
      - 'src-tauri/resources/ui/physical_lab_project_interop_ui.py'
      - 'src-tauri/resources/ui/physical_lab_builtin_requirements.txt'
      - 'src-tauri/tauri.conf.json'
      - 'scripts/applied_analysis_validation.py'
      - 'scripts/applied_analysis_advanced_validation.py'
      - 'scripts/applied_math_deep_validation.py'
      - 'scripts/inverse_regularization_validation.py'
      - 'scripts/sweep_design_metadata_validation.py'
      - 'scripts/utube_experiment_validation.py'
      - '.github/workflows/applied-analysis-integrity.yml'
  pull_request:
    paths:
      - 'src-tauri/resources/ui/physical_lab_applied_analysis.py'
      - 'src-tauri/resources/ui/physical_lab_applied_analysis_ui.py'
      - 'src-tauri/resources/ui/physical_lab_applied_analysis_advanced.py'
      - 'src-tauri/resources/ui/physical_lab_applied_analysis_advanced_ui.py'
      - 'src-tauri/resources/ui/physical_lab_applied_math_deep.py'
      - 'src-tauri/resources/ui/physical_lab_applied_math_deep_ui.py'
      - 'src-tauri/resources/ui/physical_lab_utube_experiment.py'
      - 'src-tauri/resources/ui/physical_lab_utube_experiment_ui.py'
      - 'src-tauri/resources/ui/physical_lab_sweep_executor.py'
      - 'src-tauri/resources/ui/physical_lab_sweep_design_bridge.py'
      - 'src-tauri/resources/ui/physical_lab_sweep_design_bridge_ui.py'
      - 'src-tauri/resources/ui/physical_lab_visualization_studio.py'
      - 'src-tauri/resources/ui/physical_lab_project_interop_ui.py'
      - 'src-tauri/resources/ui/physical_lab_builtin_requirements.txt'
      - 'src-tauri/tauri.conf.json'
      - 'scripts/applied_analysis_validation.py'
      - 'scripts/applied_analysis_advanced_validation.py'
      - 'scripts/applied_math_deep_validation.py'
      - 'scripts/inverse_regularization_validation.py'
      - 'scripts/sweep_design_metadata_validation.py'
      - 'scripts/utube_experiment_validation.py'
      - '.github/workflows/applied-analysis-integrity.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install scientific dependencies
        run: python -m pip install numpy scipy pandas plotly
      - name: Compile Applied Analysis modules
        run: |
          python -m py_compile src-tauri/resources/ui/physical_lab_applied_analysis.py
          python -m py_compile src-tauri/resources/ui/physical_lab_applied_analysis_ui.py
          python -m py_compile src-tauri/resources/ui/physical_lab_applied_analysis_advanced.py
          python -m py_compile src-tauri/resources/ui/physical_lab_applied_analysis_advanced_ui.py
          python -m py_compile src-tauri/resources/ui/physical_lab_applied_math_deep.py
          python -m py_compile src-tauri/resources/ui/physical_lab_applied_math_deep_ui.py
          python -m py_compile src-tauri/resources/ui/physical_lab_utube_experiment.py
          python -m py_compile src-tauri/resources/ui/physical_lab_utube_experiment_ui.py
          python -m py_compile src-tauri/resources/ui/physical_lab_sweep_executor.py
          python -m py_compile src-tauri/resources/ui/physical_lab_sweep_design_bridge.py
          python -m py_compile src-tauri/resources/ui/physical_lab_sweep_design_bridge_ui.py
          python -m py_compile src-tauri/resources/ui/physical_lab_visualization_studio.py
          python -m py_compile src-tauri/resources/ui/physical_lab_project_interop_ui.py
          python -m py_compile scripts/applied_analysis_validation.py
          python -m py_compile scripts/applied_analysis_advanced_validation.py
          python -m py_compile scripts/applied_math_deep_validation.py
          python -m py_compile scripts/inverse_regularization_validation.py
          python -m py_compile scripts/sweep_design_metadata_validation.py
          python -m py_compile scripts/utube_experiment_validation.py
      - name: Validate Tauri configuration
        run: python -m json.tool src-tauri/tauri.conf.json >/dev/null
      - name: Validate applied mathematics and statistics core
        run: python scripts/applied_analysis_validation.py
      - name: Validate advanced applied analysis and queue boundary
        run: python scripts/applied_analysis_advanced_validation.py
      - name: Validate deep applied mathematics and sweep feedback
        run: python scripts/applied_math_deep_validation.py
      - name: Validate inverse regularization and analysis handoff
        run: python scripts/inverse_regularization_validation.py
      - name: Validate sweep design metadata round trip
        run: python scripts/sweep_design_metadata_validation.py
      - name: Validate native U-tube experiment model
        run: python scripts/utube_experiment_validation.py
      - name: Verify application integration and boundaries
        run: |
          grep -q '^scipy$' src-tauri/resources/ui/physical_lab_builtin_requirements.txt
          grep -q 'physical_lab_applied_analysis.py' src-tauri/tauri.conf.json
          grep -q 'physical_lab_applied_analysis_ui.py' src-tauri/tauri.conf.json
          grep -q 'physical_lab_applied_analysis_advanced.py' src-tauri/tauri.conf.json
          grep -q 'physical_lab_applied_analysis_advanced_ui.py' src-tauri/tauri.conf.json
          grep -q 'physical_lab_applied_math_deep.py' src-tauri/tauri.conf.json
          grep -q 'physical_lab_applied_math_deep_ui.py' src-tauri/tauri.conf.json
          grep -q 'physical_lab_utube_experiment.py' src-tauri/tauri.conf.json
          grep -q 'physical_lab_utube_experiment_ui.py' src-tauri/tauri.conf.json
          grep -q 'physical_lab_sweep_design_bridge.py' src-tauri/tauri.conf.json
          grep -q 'physical_lab_sweep_design_bridge_ui.py' src-tauri/tauri.conf.json
          grep -q 'Applied Math & Statistics' src-tauri/resources/ui/physical_lab_project_interop_ui.py
          grep -q 'render_utube_experiment' src-tauri/resources/ui/physical_lab_project_interop_ui.py
          grep -q 'Rotating U-Tube Experiment' src-tauri/resources/ui/physical_lab_utube_experiment_ui.py
          grep -q 'Signed and magnitude angle' src-tauri/resources/ui/physical_lab_utube_experiment.py
          grep -q 'render_applied_analysis_advanced' src-tauri/resources/ui/physical_lab_project_interop_ui.py
          grep -q 'render_applied_math_deep' src-tauri/resources/ui/physical_lab_project_interop_ui.py
          grep -q 'render_sweep_design_bridge' src-tauri/resources/ui/physical_lab_project_interop_ui.py
          grep -q 'Regression + Diagnostics' src-tauri/resources/ui/physical_lab_applied_analysis_ui.py
          grep -q 'Bootstrap + Monte Carlo' src-tauri/resources/ui/physical_lab_applied_analysis_ui.py
          grep -q 'Design of Experiments' src-tauri/resources/ui/physical_lab_applied_analysis_ui.py
          grep -q 'Parameter Estimation' src-tauri/resources/ui/physical_lab_applied_analysis_ui.py
          grep -q 'Robust Regression' src-tauri/resources/ui/physical_lab_applied_analysis_advanced_ui.py
          grep -q 'Model Selection' src-tauri/resources/ui/physical_lab_applied_analysis_advanced_ui.py
          grep -q 'Factorial + Morris' src-tauri/resources/ui/physical_lab_applied_analysis_advanced_ui.py
          grep -q 'DOE → Sweep' src-tauri/resources/ui/physical_lab_applied_analysis_advanced_ui.py
          grep -q 'PCA / SVD' src-tauri/resources/ui/physical_lab_applied_math_deep_ui.py
          grep -q 'Regularized inverse' src-tauri/resources/ui/physical_lab_applied_math_deep_ui.py
          grep -q 'TSVD / GCV / L-curve' src-tauri/resources/ui/physical_lab_applied_math_deep_ui.py
          grep -q 'Completed Sweep Feedback + Handoff' src-tauri/resources/ui/physical_lab_applied_math_deep_ui.py
          grep -q 'pl_analysis_handoff_' src-tauri/resources/ui/physical_lab_applied_math_deep_ui.py
          ! grep -q 'start_sweep_job' src-tauri/resources/ui/physical_lab_applied_math_deep_ui.py
          grep -q 'design_metadata' src-tauri/resources/ui/physical_lab_sweep_executor.py
          grep -q '__changed_factor' src-tauri/resources/ui/physical_lab_sweep_design_bridge_ui.py
          grep -q 'Explicitly start Morris Sweep' src-tauri/resources/ui/physical_lab_sweep_design_bridge_ui.py
          grep -q 'execution_started.*False' src-tauri/resources/ui/physical_lab_sweep_design_bridge.py
          grep -q 'execution_started.*False' src-tauri/resources/ui/physical_lab_applied_analysis_advanced.py
          grep -q 'Explicitly start queued Sweep' src-tauri/resources/ui/physical_lab_applied_analysis_advanced_ui.py
          grep -q 'physical identifiability' src-tauri/resources/ui/physical_lab_applied_math_deep.py
          grep -q 'arbitrary user code' src-tauri/resources/ui/physical_lab_applied_analysis.py
          grep -q 'proposals only' src-tauri/resources/ui/physical_lab_applied_analysis.py
