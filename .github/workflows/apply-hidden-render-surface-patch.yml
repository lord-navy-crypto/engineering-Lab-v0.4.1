name: Apply hidden render surface patch

on:
  push:
    branches:
      - feature/native-desktop-reachability
    paths:
      - 'scripts/apply_hidden_render_surface_patch.py'
      - '.github/workflows/apply-hidden-render-surface-patch.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/native-desktop-reachability
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply canonical surface patch
        run: python scripts/apply_hidden_render_surface_patch.py
      - name: Commit generated manifest wiring
        run: |
          if git diff --quiet -- src-tauri/resources/surfaces.json src-tauri/tauri.conf.json; then
            echo 'No patch needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src-tauri/resources/surfaces.json src-tauri/tauri.conf.json
          git commit -m 'feat: expose buried interactive workspaces natively'
          git push origin HEAD:feature/native-desktop-reachability
