name: Apply UI Semantics Patch

on:
  push:
    branches:
      - feature/shared-scientific-ui-semantics
    paths:
      - 'scripts/apply_ui_semantics_patch.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/shared-scientific-ui-semantics
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact UI semantics patch
        run: python scripts/apply_ui_semantics_patch.py
      - name: Compile patched Python sources
        run: |
          python -m py_compile src-tauri/resources/ui/physical_lab_ui_semantics.py
          python -m py_compile src-tauri/resources/ui/physical_lab_project_interop_ui.py
          python -m py_compile src-tauri/resources/ui/physical_lab_result_inspector_ui.py
          python -m py_compile src-tauri/resources/ui/physical_lab_visual_analytics_ui.py
          python -m py_compile src-tauri/resources/ui/physical_lab_model_coupling_ui.py
          python -m py_compile src-tauri/resources/ui/physical_lab_pipeline_graph_ui.py
      - name: Commit patched production files
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src-tauri/resources/ui/physical_lab_project_interop_ui.py \
                  src-tauri/resources/ui/physical_lab_result_inspector_ui.py \
                  src-tauri/resources/ui/physical_lab_visual_analytics_ui.py \
                  src-tauri/resources/ui/physical_lab_model_coupling_ui.py \
                  src-tauri/resources/ui/physical_lab_pipeline_graph_ui.py \
                  src-tauri/tauri.conf.json
          if git diff --cached --quiet; then
            echo 'No production changes to commit.'
          else
            git commit -m 'Integrate shared scientific UI semantics'
            git push origin HEAD:feature/shared-scientific-ui-semantics
          fi
