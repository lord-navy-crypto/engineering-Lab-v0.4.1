name: Apply first-class U-Tube patch

on:
  push:
    branches:
      - feature/native-desktop-reachability
    paths:
      - 'scripts/apply_utube_first_class_patch.py'
      - '.github/workflows/apply-utube-first-class-patch.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/native-desktop-reachability
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply U-Tube module and host patch
        run: python scripts/apply_utube_first_class_patch.py
      - name: Commit generated catalog wiring
        run: |
          if git diff --quiet -- src-tauri/resources/modules.json src-tauri/resources/surfaces.json; then
            echo 'No patch needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src-tauri/resources/modules.json src-tauri/resources/surfaces.json
          git commit -m 'feat: make rotating U-Tube a first-class bundled Lab'
          git push origin HEAD:feature/native-desktop-reachability
