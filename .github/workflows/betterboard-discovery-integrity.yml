name: BetterBoard Discovery Integrity

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src-tauri/resources/ui/physical_lab_betterboard_discovery.py'
      - 'src-tauri/resources/ui/physical_lab_betterboard_discovery_ui.py'
      - 'src-tauri/resources/ui/physical_lab_betterboard_inbox.py'
      - 'src-tauri/resources/ui/physical_lab_project_interop_ui.py'
      - 'scripts/betterboard_discovery_validation.py'
      - 'src-tauri/tauri.conf.json'
      - '.github/workflows/betterboard-discovery-integrity.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile discovery modules
        run: |
          python -m py_compile \
            src-tauri/resources/ui/physical_lab_betterboard_discovery.py \
            src-tauri/resources/ui/physical_lab_betterboard_discovery_ui.py \
            src-tauri/resources/ui/physical_lab_betterboard_inbox.py \
            src-tauri/resources/ui/physical_lab_project_interop_ui.py \
            scripts/betterboard_discovery_validation.py
      - name: Validate discovery, integrity rejection and inbox states
        run: python scripts/betterboard_discovery_validation.py
      - name: Verify bundle resources
        run: |
          grep -q 'physical_lab_betterboard_discovery.py' src-tauri/tauri.conf.json
          grep -q 'physical_lab_betterboard_discovery_ui.py' src-tauri/tauri.conf.json
          grep -q 'physical_lab_betterboard_inbox.py' src-tauri/tauri.conf.json
