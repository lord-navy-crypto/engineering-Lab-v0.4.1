name: Deep Applied Math Workflow Integrity

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src-tauri/resources/ui/physical_lab_applied_math_deep_ui.py'
      - '.github/workflows/deep-applied-math-workflow-integrity.yml'

jobs:
  staged-workflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Deep Applied Math UI
        run: python -m py_compile src-tauri/resources/ui/physical_lab_applied_math_deep_ui.py
      - name: Verify staged Deep Applied Math workflow
        shell: bash
        run: |
          set -euo pipefail
          file='src-tauri/resources/ui/physical_lab_applied_math_deep_ui.py'
          grep -q 'Deep analysis task' "$file"
          grep -q 'pl_deep_task_' "$file"
          grep -q 'Linear algebra method' "$file"
          grep -q 'pl_deep_linear_method_' "$file"
          grep -q 'PCA / SVD' "$file"
          grep -q 'Conditioning' "$file"
          grep -q 'Regularized inverse' "$file"
          grep -q 'TSVD / GCV / L-curve' "$file"
          grep -q 'Completed Sweep Feedback + Handoff' "$file"
          grep -q 'execution_started.*False' "$file"
          if grep -q 'st.tabs' "$file"; then
            echo '::error::Deep Applied Math must not use eager st.tabs navigation.'
            exit 1
          fi
