name: LabBridge Integrity

on:
  pull_request:
    paths:
      - 'src-tauri/resources/ui/physical_lab_lab_journey.py'
      - 'src-tauri/resources/ui/physical_lab_labbridge.py'
      - 'src-tauri/resources/ui/physical_lab_labbridge_ui.py'
      - 'src-tauri/resources/ui/physical_lab_openguin_adapter.py'
      - 'src-tauri/resources/ui/physical_lab_science_protocol.py'
      - 'src-tauri/resources/ui/physical_lab_science_protocol_ui.py'
      - 'src-tauri/resources/ui/physical_lab_analysis_plan_store.py'
      - 'src-tauri/resources/ui/physical_lab_project_interop.py'
      - 'src-tauri/resources/ui/physical_lab_project_interop_ui.py'
      - 'src-tauri/tauri.conf.json'
      - 'scripts/labbridge_validation.py'
      - 'scripts/openguin_adapter_validation.py'
      - 'scripts/openguin_science_protocol_validation.py'
      - 'scripts/openguin_analysis_plan_store_validation.py'
      - '.github/workflows/labbridge-integrity.yml'
  workflow_dispatch:

jobs:
  labbridge-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install scientific dependencies
        run: python -m pip install --upgrade pip numpy scipy pandas streamlit matplotlib plotly
      - name: Compile LabBridge modules
        run: |
          python -m py_compile \
            src-tauri/resources/ui/physical_lab_lab_journey.py \
            src-tauri/resources/ui/physical_lab_labbridge.py \
            src-tauri/resources/ui/physical_lab_labbridge_ui.py \
            src-tauri/resources/ui/physical_lab_openguin_adapter.py \
            src-tauri/resources/ui/physical_lab_science_protocol.py \
            src-tauri/resources/ui/physical_lab_science_protocol_ui.py \
            src-tauri/resources/ui/physical_lab_analysis_plan_store.py \
            src-tauri/resources/ui/physical_lab_project_interop.py \
            src-tauri/resources/ui/physical_lab_project_interop_ui.py \
            scripts/labbridge_validation.py \
            scripts/openguin_adapter_validation.py \
            scripts/openguin_science_protocol_validation.py \
            scripts/openguin_analysis_plan_store_validation.py
      - name: Validate LabBridge and Lab Journey semantics
        run: python scripts/labbridge_validation.py
      - name: Validate OpenPenguin adapter boundary
        run: python scripts/openguin_adapter_validation.py
      - name: Validate OpenPenguin scientific protocol
        run: python scripts/openguin_science_protocol_validation.py
      - name: Validate OpenPenguin analysis-plan provenance
        run: python scripts/openguin_analysis_plan_store_validation.py
      - name: Verify staged LabBridge workspace
        run: |
          grep -q 'LabBridge & Research Record' src-tauri/resources/ui/physical_lab_labbridge_ui.py
          grep -q 'LabBridge workspace' src-tauri/resources/ui/physical_lab_labbridge_ui.py
          grep -q 'pl_labbridge_workspace_' src-tauri/resources/ui/physical_lab_labbridge_ui.py
          grep -q 'BetterBoard Ingress' src-tauri/resources/ui/physical_lab_labbridge_ui.py
          grep -q 'Experiment Notebook' src-tauri/resources/ui/physical_lab_labbridge_ui.py
          grep -q 'Lab Journey' src-tauri/resources/ui/physical_lab_labbridge_ui.py
          grep -q 'OpenPenguin Bridge' src-tauri/resources/ui/physical_lab_labbridge_ui.py
          if grep -q 'st.tabs' src-tauri/resources/ui/physical_lab_labbridge_ui.py; then
            echo 'LabBridge must not render all complex workspaces through st.tabs'
            exit 1
          fi
      - name: Verify bundled LabBridge and science-protocol resources
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          cfg=json.loads(Path('src-tauri/tauri.conf.json').read_text())
          resources=cfg['bundle']['resources']
          required={
              'resources/ui/physical_lab_lab_journey.py',
              'resources/ui/physical_lab_labbridge.py',
              'resources/ui/physical_lab_labbridge_ui.py',
              'resources/ui/physical_lab_openguin_adapter.py',
              'resources/ui/physical_lab_science_protocol.py',
              'resources/ui/physical_lab_science_protocol_ui.py',
              'resources/ui/physical_lab_analysis_plan_store.py',
          }
          missing=sorted(required-set(resources))
          if missing:
              raise SystemExit('missing bundled LabBridge/science-protocol resources: '+', '.join(missing))
          print('PASS: LabBridge and OpenPenguin science-protocol resources bundled')
          PY
      - name: Verify OpenPenguin scientific authority boundaries
        run: |
          grep -q 'engineering-lab-scientific-context-v1' src-tauri/resources/ui/physical_lab_science_protocol.py
          grep -q 'engineering-lab-analysis-plan-v1' src-tauri/resources/ui/physical_lab_science_protocol.py
          grep -q 'mutation_authority' src-tauri/resources/ui/physical_lab_science_protocol.py
          grep -q 'Engineering Lab remains the scientific computation and evidence authority' src-tauri/resources/ui/physical_lab_science_protocol.py
          grep -q 'scientific_evidence.*False' src-tauri/resources/ui/physical_lab_analysis_plan_store.py
          grep -q 'executed.*False' src-tauri/resources/ui/physical_lab_analysis_plan_store.py
          grep -q 'Ask OpenPenguin about this' src-tauri/resources/ui/physical_lab_science_protocol_ui.py
          grep -q 'Request Analysis Plan' src-tauri/resources/ui/physical_lab_science_protocol_ui.py
          grep -q 'Prepare in Engineering Lab' src-tauri/resources/ui/physical_lab_science_protocol_ui.py
          grep -q 'Record plan provenance' src-tauri/resources/ui/physical_lab_science_protocol_ui.py
          grep -q '"executed": False' src-tauri/resources/ui/physical_lab_science_protocol_ui.py
