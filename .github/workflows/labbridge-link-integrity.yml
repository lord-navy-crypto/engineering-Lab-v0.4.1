name: LabBridge three-product link integrity

on:
  push:
    branches:
      - integration/labbridge-link-v1
      - feature/expand-physics-simulation-scenarios
    paths:
      - 'src-tauri/resources/ui/physical_lab_labbridge_link.py'
      - 'src-tauri/resources/ui/physical_lab_openguin_adapter.py'
      - 'scripts/labbridge_link.py'
      - 'scripts/labbridge_link_validation.py'
      - '.github/workflows/labbridge-link-integrity.yml'
  pull_request:
    paths:
      - 'src-tauri/resources/ui/physical_lab_labbridge_link.py'
      - 'src-tauri/resources/ui/physical_lab_openguin_adapter.py'
      - 'scripts/labbridge_link.py'
      - 'scripts/labbridge_link_validation.py'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate BetterBoard / Engineering Lab / OpenPenguin boundaries
        run: python3 scripts/labbridge_link_validation.py
