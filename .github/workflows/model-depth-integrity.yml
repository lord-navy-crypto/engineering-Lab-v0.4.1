name: Model Depth III Integrity

on:
  pull_request:
    paths:
      - 'src-tauri/resources/ui/physical_lab_model_depth.py'
      - 'src-tauri/resources/ui/physical_lab_model_depth_ui.py'
      - 'src-tauri/resources/ui/physical_lab_engineering.py'
      - 'src-tauri/tauri.conf.json'
      - 'scripts/model_depth_validation.py'
      - '.github/workflows/model-depth-integrity.yml'
  push:
    branches: [ main ]
    paths:
      - 'src-tauri/resources/ui/physical_lab_model_depth.py'
      - 'src-tauri/resources/ui/physical_lab_model_depth_ui.py'
      - 'src-tauri/resources/ui/physical_lab_engineering.py'
      - 'src-tauri/tauri.conf.json'
      - 'scripts/model_depth_validation.py'
      - '.github/workflows/model-depth-integrity.yml'

permissions:
  contents: read

jobs:
  model-depth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install numerical dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy
      - name: Syntax and packaging wiring
        run: |
          python -m py_compile src-tauri/resources/ui/physical_lab_model_depth.py
          python -m py_compile src-tauri/resources/ui/physical_lab_model_depth_ui.py
          python -m py_compile src-tauri/resources/ui/physical_lab_engineering.py
          python -m py_compile scripts/model_depth_validation.py
          python -m json.tool src-tauri/tauri.conf.json >/dev/null
          grep -q 'physical_lab_model_depth.py' src-tauri/tauri.conf.json
          grep -q 'physical_lab_model_depth_ui.py' src-tauri/tauri.conf.json
          grep -q 'render_model_depth_workspace' src-tauri/resources/ui/physical_lab_engineering.py
      - name: Model-depth deterministic validation
        run: python scripts/model_depth_validation.py
