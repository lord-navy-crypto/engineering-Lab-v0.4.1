name: Model Depth IV Integrity

on:
  push:
    branches: [ main ]
    paths:
      - 'src-tauri/resources/ui/physical_lab_model_depth_iv.py'
      - 'src-tauri/resources/ui/physical_lab_model_depth_iv_ui.py'
      - 'src-tauri/resources/ui/physical_lab_model_depth_ui.py'
      - 'src-tauri/resources/ui/physical_lab_engineering.py'
      - 'src-tauri/tauri.conf.json'
      - 'scripts/model_depth_iv_validation.py'
      - '.github/workflows/model-depth-iv-integrity.yml'
  pull_request:
    paths:
      - 'src-tauri/resources/ui/physical_lab_model_depth_iv.py'
      - 'src-tauri/resources/ui/physical_lab_model_depth_iv_ui.py'
      - 'src-tauri/resources/ui/physical_lab_model_depth_ui.py'
      - 'src-tauri/resources/ui/physical_lab_engineering.py'
      - 'src-tauri/tauri.conf.json'
      - 'scripts/model_depth_iv_validation.py'
      - '.github/workflows/model-depth-iv-integrity.yml'

permissions:
  contents: read

jobs:
  model-depth-iv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install numerical dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy
      - name: Syntax and packaging wiring
        run: |
          python -m py_compile src-tauri/resources/ui/physical_lab_model_depth_iv.py
          python -m py_compile src-tauri/resources/ui/physical_lab_model_depth_iv_ui.py
          python -m py_compile src-tauri/resources/ui/physical_lab_model_depth_ui.py
          python -m py_compile src-tauri/resources/ui/physical_lab_engineering.py
          python -m py_compile scripts/model_depth_iv_validation.py
          python -m json.tool src-tauri/tauri.conf.json >/dev/null
          grep -q 'physical_lab_model_depth_iv.py' src-tauri/tauri.conf.json
          grep -q 'physical_lab_model_depth_iv_ui.py' src-tauri/tauri.conf.json
          grep -q 'numerical-methods' src-tauri/resources/ui/physical_lab_engineering.py
          grep -q 'render_model_depth_iv_workspace' src-tauri/resources/ui/physical_lab_model_depth_ui.py
      - name: Deterministic depth validation
        run: PYTHONPATH=src-tauri/resources/ui python scripts/model_depth_iv_validation.py
