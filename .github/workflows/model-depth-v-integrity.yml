name: Model Depth V Integrity

on:
  pull_request:
    paths:
      - 'src-tauri/resources/ui/physical_lab_model_depth_v.py'
      - 'src-tauri/resources/ui/physical_lab_model_depth_v_ui.py'
      - 'src-tauri/resources/ui/physical_lab_engineering.py'
      - 'src-tauri/tauri.conf.json'
      - 'scripts/model_depth_v_validation.py'
      - '.github/workflows/model-depth-v-integrity.yml'
  workflow_dispatch:

jobs:
  stochastic-localization-depth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install numerical dependencies
        run: python -m pip install --upgrade pip numpy scipy
      - name: Syntax and packaging wiring
        run: |
          python -m py_compile \
            src-tauri/resources/ui/physical_lab_model_depth_v.py \
            src-tauri/resources/ui/physical_lab_model_depth_v_ui.py \
            scripts/model_depth_v_validation.py
          python - <<'PY'
          import json
          from pathlib import Path
          cfg=json.loads(Path('src-tauri/tauri.conf.json').read_text())
          resources=cfg['bundle']['resources']
          for p in ('resources/ui/physical_lab_model_depth_v.py','resources/ui/physical_lab_model_depth_v_ui.py'):
              assert p in resources, p
          eng=Path('src-tauri/resources/ui/physical_lab_engineering.py').read_text()
          assert 'render_model_depth_v_workspace' in eng
          PY
      - name: Stochastic scaling and defect localization validation
        run: python scripts/model_depth_v_validation.py
