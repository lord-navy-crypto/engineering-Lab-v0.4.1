name: Model Depth VI Integrity

on:
  pull_request:
    paths:
      - 'src-tauri/resources/ui/physical_lab_model_depth_vi.py'
      - 'src-tauri/resources/ui/physical_lab_model_depth_vi_ui.py'
      - 'src-tauri/resources/ui/physical_lab_engineering.py'
      - 'src-tauri/tauri.conf.json'
      - 'scripts/model_depth_vi_validation.py'
      - '.github/workflows/model-depth-vi-integrity.yml'
  workflow_dispatch:

jobs:
  model-depth-vi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install numerical dependency
        run: python -m pip install numpy
      - name: Syntax and packaging wiring
        run: |
          python -m py_compile src-tauri/resources/ui/physical_lab_model_depth_vi.py src-tauri/resources/ui/physical_lab_model_depth_vi_ui.py src-tauri/resources/ui/physical_lab_engineering.py
          python -m json.tool src-tauri/tauri.conf.json >/dev/null
          grep -q 'physical_lab_model_depth_vi.py' src-tauri/tauri.conf.json
          grep -q 'physical_lab_model_depth_vi_ui.py' src-tauri/tauri.conf.json
          grep -q '_load_model_depth_vi_ui_module' src-tauri/resources/ui/physical_lab_engineering.py
      - name: Model Depth VI deterministic validation
        run: python scripts/model_depth_vi_validation.py
