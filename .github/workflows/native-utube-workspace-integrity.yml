name: Native Experiment Workspace Integrity

on:
  pull_request:
    paths:
      - "web/**"
      - "scripts/native_utube_workspace_validation.py"
      - "scripts/action_catalog.py"
      - "scripts/native_original_setup_parity_validation.py"
      - "src-tauri/resources/ui/**"
      - "scripts/native_experiment_adapter_validation.py"
      - "src-tauri/resources/native_experiment_runner.py"
      - "src-tauri/resources/native_capability_parity.json"
      - "src-tauri/resources/ui/physical_lab_surface_registry.py"
      - "src-tauri/src/lib.rs"
      - "src-tauri/tauri.conf.json"
      - ".github/workflows/native-utube-workspace-integrity.yml"
  push:
    branches: [main]
    paths:
      - "web/**"
      - "scripts/native_utube_workspace_validation.py"
      - "scripts/native_experiment_adapter_validation.py"
      - "src-tauri/resources/native_experiment_runner.py"
      - "src-tauri/resources/native_capability_parity.json"
      - "src-tauri/resources/ui/physical_lab_surface_registry.py"
      - ".github/workflows/native-utube-workspace-integrity.yml"

jobs:
  native-experiments:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check numpy scipy pandas
      - run: node --check web/utube-native.js
      - run: node --check web/action-catalog.js
      - run: node --check web/native-experiments.js
      - run: node --check web/app.js
      - run: python scripts/prepare.py
      - run: python scripts/action_catalog.py --strict-baseline --output dist/action-catalog.js
      - run: test -f dist/native-experiments.js && test -f dist/utube-native.js && test -f dist/action-catalog.js
      - run: node --check dist/native-experiments.js
      - run: node --check dist/utube-native.js
      - run: node --check dist/action-catalog.js
      - run: python -m py_compile src-tauri/resources/native_experiment_runner.py scripts/native_experiment_adapter_validation.py scripts/action_catalog.py
      - run: python scripts/native_utube_workspace_validation.py
      - run: python scripts/native_original_setup_parity_validation.py
      - run: python scripts/native_experiment_adapter_validation.py
      - run: rustfmt --edition 2021 --emit stdout src-tauri/src/lib.rs >/dev/null
