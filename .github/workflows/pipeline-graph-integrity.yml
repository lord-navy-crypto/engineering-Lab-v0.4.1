name: Pipeline Graph Integrity

on:
  pull_request:
    paths:
      - 'src-tauri/resources/ui/physical_lab_pipeline_graph.py'
      - 'src-tauri/resources/ui/physical_lab_pipeline_graph_ui.py'
      - 'src-tauri/resources/ui/physical_lab_model_coupling.py'
      - 'src-tauri/resources/ui/physical_lab_project_interop.py'
      - 'src-tauri/resources/ui/physical_lab_project_interop_ui.py'
      - 'src-tauri/resources/ui/physical_lab_sweep_executor.py'
      - 'src-tauri/tauri.conf.json'
      - 'scripts/pipeline_graph_validation.py'
      - '.github/workflows/pipeline-graph-integrity.yml'
  workflow_dispatch:

jobs:
  pipeline-graph-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install scientific dependencies
        run: python -m pip install --upgrade pip numpy scipy
      - name: Compile workflow graph modules
        run: |
          python -m py_compile \
            src-tauri/resources/ui/physical_lab_pipeline_graph.py \
            src-tauri/resources/ui/physical_lab_pipeline_graph_ui.py \
            src-tauri/resources/ui/physical_lab_project_interop.py \
            src-tauri/resources/ui/physical_lab_project_interop_ui.py \
            scripts/pipeline_graph_validation.py
      - name: Validate deterministic DAG dispatch
        run: python scripts/pipeline_graph_validation.py
      - name: Verify bundled workflow resources
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          cfg=json.loads(Path('src-tauri/tauri.conf.json').read_text())
          resources=cfg['bundle']['resources']
          required={
              'resources/ui/physical_lab_pipeline_graph.py',
              'resources/ui/physical_lab_pipeline_graph_ui.py',
          }
          missing=sorted(required-set(resources))
          if missing:
              raise SystemExit('missing bundled pipeline graph resources: '+', '.join(missing))
          print('PASS: pipeline graph resources bundled')
          PY
