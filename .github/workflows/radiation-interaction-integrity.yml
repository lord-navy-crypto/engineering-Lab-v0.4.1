name: Radiation Interaction Integrity

on:
  push:
    branches: [ main ]
    paths:
      - 'src-tauri/resources/ui/physical_lab_radiation_interactions.py'
      - 'src-tauri/resources/ui/physical_lab_radiation_interactions_ui.py'
      - 'src-tauri/resources/ui/physical_lab_radiation_quality_ui.py'
      - 'src-tauri/tauri.conf.json'
      - 'scripts/radiation_interaction_validation.py'
      - '.github/workflows/radiation-interaction-integrity.yml'
  pull_request:
    paths:
      - 'src-tauri/resources/ui/physical_lab_radiation_interactions.py'
      - 'src-tauri/resources/ui/physical_lab_radiation_interactions_ui.py'
      - 'src-tauri/resources/ui/physical_lab_radiation_quality_ui.py'
      - 'src-tauri/tauri.conf.json'
      - 'scripts/radiation_interaction_validation.py'
      - '.github/workflows/radiation-interaction-integrity.yml'

permissions:
  contents: read

jobs:
  pairwise-radiation-interactions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install validation dependency
        run: python -m pip install --disable-pip-version-check numpy
      - name: Syntax and packaging wiring
        run: |
          python -m py_compile src-tauri/resources/ui/physical_lab_radiation_interactions.py
          python -m py_compile src-tauri/resources/ui/physical_lab_radiation_interactions_ui.py
          python -m py_compile src-tauri/resources/ui/physical_lab_radiation_quality_ui.py
          python -m py_compile scripts/radiation_interaction_validation.py
          python -m json.tool src-tauri/tauri.conf.json >/dev/null
          grep -q 'physical_lab_radiation_interactions.py' src-tauri/tauri.conf.json
          grep -q 'physical_lab_radiation_interactions_ui.py' src-tauri/tauri.conf.json
          grep -q 'render_radiation_interactions_workspace' src-tauri/resources/ui/physical_lab_radiation_quality_ui.py
      - name: Pairwise interaction contrast validation
        run: python scripts/radiation_interaction_validation.py
