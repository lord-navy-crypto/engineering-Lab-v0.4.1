name: Result Contract Environment Integrity

on:
  pull_request:
    paths:
      - 'src-tauri/resources/ui/physical_lab_result_contracts.py'
      - 'src-tauri/resources/ui/physical_lab_environment_manifest.py'
      - 'src-tauri/resources/ui/physical_lab_result_inspector_ui.py'
      - 'src-tauri/resources/ui/physical_lab_project_interop.py'
      - 'src-tauri/tauri.conf.json'
      - 'scripts/result_contract_environment_validation.py'
      - '.github/workflows/result-contract-environment-integrity.yml'
  workflow_dispatch:

jobs:
  result-contract-environment-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install scientific dependencies
        run: python -m pip install --upgrade pip numpy scipy pandas streamlit matplotlib
      - name: Compile metadata and environment modules
        run: |
          python -m py_compile \
            src-tauri/resources/ui/physical_lab_result_contracts.py \
            src-tauri/resources/ui/physical_lab_environment_manifest.py \
            src-tauri/resources/ui/physical_lab_result_inspector_ui.py \
            src-tauri/resources/ui/physical_lab_project_interop.py \
            scripts/result_contract_environment_validation.py
      - name: Validate contracts uncertainty and environment provenance
        run: python scripts/result_contract_environment_validation.py
      - name: Verify bundled metadata resources
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          cfg=json.loads(Path('src-tauri/tauri.conf.json').read_text())
          resources=cfg['bundle']['resources']
          required={
              'resources/ui/physical_lab_result_contracts.py',
              'resources/ui/physical_lab_environment_manifest.py',
          }
          missing=sorted(required-set(resources))
          if missing:
              raise SystemExit('missing bundled metadata resources: '+', '.join(missing))
          print('PASS: result contract/environment resources bundled')
          PY
