name: Result Inspector Integrity

on:
  pull_request:
    paths:
      - 'src-tauri/resources/ui/physical_lab_result_inspector.py'
      - 'src-tauri/resources/ui/physical_lab_result_inspector_ui.py'
      - 'src-tauri/resources/ui/physical_lab_project_interop.py'
      - 'src-tauri/resources/ui/physical_lab_project_interop_ui.py'
      - 'src-tauri/resources/ui/physical_lab_sweep_executor.py'
      - 'src-tauri/tauri.conf.json'
      - 'scripts/result_inspector_validation.py'
      - '.github/workflows/result-inspector-integrity.yml'
  workflow_dispatch:

jobs:
  result-inspector-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install scientific dependencies
        run: python -m pip install --upgrade pip numpy scipy
      - name: Compile result inspection modules
        run: |
          python -m py_compile \
            src-tauri/resources/ui/physical_lab_result_inspector.py \
            src-tauri/resources/ui/physical_lab_result_inspector_ui.py \
            src-tauri/resources/ui/physical_lab_project_interop.py \
            src-tauri/resources/ui/physical_lab_project_interop_ui.py \
            scripts/result_inspector_validation.py
      - name: Validate inspection sanity and materialization provenance
        run: python scripts/result_inspector_validation.py
      - name: Verify bundled result inspector resources
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          cfg=json.loads(Path('src-tauri/tauri.conf.json').read_text())
          resources=cfg['bundle']['resources']
          required={
              'resources/ui/physical_lab_result_inspector.py',
              'resources/ui/physical_lab_result_inspector_ui.py',
          }
          missing=sorted(required-set(resources))
          if missing:
              raise SystemExit('missing bundled result inspector resources: '+', '.join(missing))
          print('PASS: result inspector resources bundled')
          PY
