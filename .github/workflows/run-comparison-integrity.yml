name: Run Comparison Integrity

on:
  pull_request:
    paths:
      - 'src-tauri/resources/ui/physical_lab_run_comparison.py'
      - 'src-tauri/resources/ui/physical_lab_run_comparison_ui.py'
      - 'src-tauri/resources/ui/physical_lab_run_snapshot_store.py'
      - 'src-tauri/resources/ui/physical_lab_project_interop.py'
      - 'src-tauri/resources/ui/physical_lab_project_interop_ui.py'
      - 'src-tauri/resources/ui/physical_lab_environment_manifest.py'
      - 'src-tauri/resources/ui/physical_lab_result_contracts.py'
      - 'src-tauri/tauri.conf.json'
      - 'scripts/run_comparison_validation.py'
      - '.github/workflows/run-comparison-integrity.yml'
  workflow_dispatch:

jobs:
  run-comparison-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install scientific dependencies
        run: python -m pip install --upgrade pip numpy scipy pandas streamlit matplotlib
      - name: Compile comparison modules
        run: |
          python -m py_compile \
            src-tauri/resources/ui/physical_lab_run_comparison.py \
            src-tauri/resources/ui/physical_lab_run_comparison_ui.py \
            src-tauri/resources/ui/physical_lab_run_snapshot_store.py \
            src-tauri/resources/ui/physical_lab_project_interop.py \
            src-tauri/resources/ui/physical_lab_project_interop_ui.py \
            scripts/run_comparison_validation.py
      - name: Validate comparison and staleness semantics
        run: python scripts/run_comparison_validation.py
      - name: Verify bundled comparison resources
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          cfg=json.loads(Path('src-tauri/tauri.conf.json').read_text())
          resources=cfg['bundle']['resources']
          required={
              'resources/ui/physical_lab_run_comparison.py',
              'resources/ui/physical_lab_run_comparison_ui.py',
              'resources/ui/physical_lab_run_snapshot_store.py',
          }
          missing=sorted(required-set(resources))
          if missing:
              raise SystemExit('missing bundled run comparison resources: '+', '.join(missing))
          print('PASS: run comparison resources bundled')
          PY
