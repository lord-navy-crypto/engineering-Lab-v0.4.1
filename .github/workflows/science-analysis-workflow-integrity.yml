name: Science Analysis Workflow Integrity

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src-tauri/resources/ui/physical_lab_tradeoff_analysis_ui.py'
      - '.github/workflows/science-analysis-workflow-integrity.yml'

jobs:
  staged-workflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Science Analysis UI
        run: python -m py_compile src-tauri/resources/ui/physical_lab_tradeoff_analysis_ui.py
      - name: Verify staged Science Analysis workflow
        shell: bash
        run: |
          set -euo pipefail
          file='src-tauri/resources/ui/physical_lab_tradeoff_analysis_ui.py'
          grep -q 'Science analysis task' "$file"
          grep -q 'pl_science_task_' "$file"
          grep -q 'Semantics view' "$file"
          grep -q 'pl_science_semantics_view_' "$file"
          grep -q 'Sensitivity method' "$file"
          grep -q 'pl_science_sensitivity_method_' "$file"
          grep -q 'Scientific Semantics' "$file"
          grep -q 'Sensitivity + Surface' "$file"
          grep -q 'Unit-aware Compare' "$file"
          grep -q 'Correlation Matrix' "$file"
          grep -q 'Pareto Frontier' "$file"
          grep -q 'Analysis Summary' "$file"
          grep -q 'Units & contracts' "$file"
          grep -q 'Native UQ' "$file"
          grep -q 'Sensitivity' "$file"
          grep -q 'Response Surface' "$file"
          if grep -q 'st.tabs' "$file"; then
            echo '::error::Science Analysis must not use eager st.tabs navigation.'
            exit 1
          fi
