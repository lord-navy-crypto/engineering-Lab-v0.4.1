name: Engineering Lab Trade-off Explorer Integrity

on:
  workflow_dispatch:
  push:
    branches:
      - feature/expand-physics-simulation-scenarios
    paths:
      - 'src-tauri/resources/ui/physical_lab_tradeoff_analysis.py'
      - 'src-tauri/resources/ui/physical_lab_tradeoff_analysis_ui.py'
      - 'src-tauri/resources/ui/physical_lab_project_interop_ui.py'
      - 'src-tauri/tauri.conf.json'
      - 'scripts/tradeoff_analysis_validation.py'
      - '.github/workflows/tradeoff-analysis-integrity.yml'
  pull_request:
    paths:
      - 'src-tauri/resources/ui/physical_lab_tradeoff_analysis.py'
      - 'src-tauri/resources/ui/physical_lab_tradeoff_analysis_ui.py'
      - 'src-tauri/resources/ui/physical_lab_project_interop_ui.py'
      - 'src-tauri/tauri.conf.json'
      - 'scripts/tradeoff_analysis_validation.py'
      - '.github/workflows/tradeoff-analysis-integrity.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install analysis dependencies
        run: python -m pip install pandas plotly
      - name: Compile Trade-off Explorer modules
        run: |
          python -m py_compile src-tauri/resources/ui/physical_lab_tradeoff_analysis.py
          python -m py_compile src-tauri/resources/ui/physical_lab_tradeoff_analysis_ui.py
          python -m py_compile src-tauri/resources/ui/physical_lab_project_interop_ui.py
          python -m py_compile scripts/tradeoff_analysis_validation.py
      - name: Validate correlation and Pareto contracts
        run: python scripts/tradeoff_analysis_validation.py
      - name: Verify application integration
        run: |
          grep -q 'Trade-off Explorer' src-tauri/resources/ui/physical_lab_project_interop_ui.py
          grep -q 'physical_lab_tradeoff_analysis.py' src-tauri/tauri.conf.json
          grep -q 'physical_lab_tradeoff_analysis_ui.py' src-tauri/tauri.conf.json
          grep -q 'not causality' src-tauri/resources/ui/physical_lab_tradeoff_analysis.py
          grep -q 'non-dominance' src-tauri/resources/ui/physical_lab_tradeoff_analysis.py
