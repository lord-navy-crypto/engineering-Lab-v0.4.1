name: UI Semantics Integrity

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src-tauri/resources/ui/physical_lab_ui_semantics.py'
      - 'src-tauri/resources/ui/physical_lab_project_interop_ui.py'
      - 'src-tauri/resources/ui/physical_lab_result_inspector_ui.py'
      - 'src-tauri/resources/ui/physical_lab_visual_analytics_ui.py'
      - 'src-tauri/resources/ui/physical_lab_model_coupling_ui.py'
      - 'src-tauri/resources/ui/physical_lab_pipeline_graph_ui.py'
      - 'src-tauri/tauri.conf.json'
      - 'scripts/ui_semantics_validation.py'
      - '.github/workflows/ui-semantics-integrity.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile semantic contract and participating workspaces
        run: |
          python -m py_compile scripts/ui_semantics_validation.py
          python -m py_compile src-tauri/resources/ui/physical_lab_project_interop_ui.py
          python -m py_compile src-tauri/resources/ui/physical_lab_result_inspector_ui.py
          python -m py_compile src-tauri/resources/ui/physical_lab_visual_analytics_ui.py
          python -m py_compile src-tauri/resources/ui/physical_lab_model_coupling_ui.py
          python -m py_compile src-tauri/resources/ui/physical_lab_pipeline_graph_ui.py
      - name: Validate shared scientific UI semantics
        run: python scripts/ui_semantics_validation.py
