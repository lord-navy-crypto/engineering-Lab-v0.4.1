name: Engineering Lab UI Workbench Validation

on:
  pull_request:
    paths:
      - 'src-tauri/resources/ui/physical_lab_advanced.py'
      - 'src-tauri/resources/ui/physical_lab_engineering.py'
      - '.github/workflows/ui-workbench-validation.yml'
  workflow_dispatch:

jobs:
  validate-ui-workbench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile modified UI modules
        run: |
          python -m py_compile \
            src-tauri/resources/ui/physical_lab_advanced.py \
            src-tauri/resources/ui/physical_lab_engineering.py

      - name: Run repository source self-check
        run: python scripts/self_check.py
