name: U-Tube Advanced Physics Integrity

on:
  workflow_dispatch:
  push:
    branches:
      - feature/expand-physics-simulation-scenarios
    paths:
      - 'src-tauri/resources/ui/physical_lab_utube_advanced.py'
      - 'src-tauri/resources/ui/physical_lab_utube_advanced_ui.py'
      - 'src-tauri/resources/ui/physical_lab_utube_experiment.py'
      - 'src-tauri/resources/ui/physical_lab_project_interop_ui.py'
      - 'src-tauri/tauri.conf.json'
      - 'scripts/utube_advanced_validation.py'
      - '.github/workflows/utube-advanced-integrity.yml'
  pull_request:
    paths:
      - 'src-tauri/resources/ui/physical_lab_utube_advanced.py'
      - 'src-tauri/resources/ui/physical_lab_utube_advanced_ui.py'
      - 'src-tauri/resources/ui/physical_lab_utube_experiment.py'
      - 'src-tauri/resources/ui/physical_lab_project_interop_ui.py'
      - 'src-tauri/tauri.conf.json'
      - 'scripts/utube_advanced_validation.py'
      - '.github/workflows/utube-advanced-integrity.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install scientific dependencies
        run: python -m pip install numpy scipy pandas plotly
      - name: Compile advanced U-tube modules
        run: |
          python -m py_compile src-tauri/resources/ui/physical_lab_utube_advanced.py
          python -m py_compile src-tauri/resources/ui/physical_lab_utube_advanced_ui.py
          python -m py_compile scripts/utube_advanced_validation.py
      - name: Validate advanced U-tube physics and engineering tools
        run: python scripts/utube_advanced_validation.py
      - name: Verify bundle and workspace integration
        run: |
          grep -q 'physical_lab_utube_advanced.py' src-tauri/tauri.conf.json
          grep -q 'physical_lab_utube_advanced_ui.py' src-tauri/tauri.conf.json
          grep -q 'render_utube_advanced' src-tauri/resources/ui/physical_lab_project_interop_ui.py
          grep -q 'U-Tube Advanced Physics & Engineering' src-tauri/resources/ui/physical_lab_utube_advanced_ui.py
          grep -q 'Inverse design solves the current model only' src-tauri/resources/ui/physical_lab_utube_advanced_ui.py
          grep -q 'computational proposals' src-tauri/resources/ui/physical_lab_utube_advanced.py
