name: U-Tube Uncertainty Integrity

on:
  workflow_dispatch:
  push:
    branches:
      - feature/expand-physics-simulation-scenarios
    paths:
      - 'src-tauri/resources/ui/physical_lab_utube_uncertainty.py'
      - 'src-tauri/resources/ui/physical_lab_utube_uncertainty_ui.py'
      - 'src-tauri/resources/ui/physical_lab_project_interop_ui.py'
      - 'src-tauri/tauri.conf.json'
      - 'scripts/utube_uncertainty_validation.py'
      - '.github/workflows/utube-uncertainty-integrity.yml'
  pull_request:
    paths:
      - 'src-tauri/resources/ui/physical_lab_utube_uncertainty.py'
      - 'src-tauri/resources/ui/physical_lab_utube_uncertainty_ui.py'
      - 'src-tauri/resources/ui/physical_lab_project_interop_ui.py'
      - 'src-tauri/tauri.conf.json'
      - 'scripts/utube_uncertainty_validation.py'
      - '.github/workflows/utube-uncertainty-integrity.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install scientific dependencies
        run: python -m pip install numpy scipy pandas plotly
      - name: Compile modules
        run: |
          python -m py_compile src-tauri/resources/ui/physical_lab_utube_uncertainty.py
          python -m py_compile src-tauri/resources/ui/physical_lab_utube_uncertainty_ui.py
          python -m py_compile scripts/utube_uncertainty_validation.py
      - name: Validate uncertainty propagation
        run: python scripts/utube_uncertainty_validation.py
      - name: Verify integration and boundaries
        run: |
          grep -q 'physical_lab_utube_uncertainty.py' src-tauri/tauri.conf.json
          grep -q 'physical_lab_utube_uncertainty_ui.py' src-tauri/tauri.conf.json
          grep -q 'render_utube_uncertainty' src-tauri/resources/ui/physical_lab_project_interop_ui.py
          grep -q 'independent Normal' src-tauri/resources/ui/physical_lab_utube_uncertainty.py
          grep -q 'model-form error' src-tauri/resources/ui/physical_lab_utube_uncertainty.py
          grep -q 'Predictive interval overlap' src-tauri/resources/ui/physical_lab_utube_uncertainty.py
          ! grep -q 'start_sweep_job' src-tauri/resources/ui/physical_lab_utube_uncertainty_ui.py
          ! grep -q 'request_advisory' src-tauri/resources/ui/physical_lab_utube_uncertainty.py
