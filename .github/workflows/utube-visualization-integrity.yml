name: U-Tube Visualization Integrity

on:
  workflow_dispatch:
  push:
    branches:
      - feature/utube-native-visual-integration
    paths:
      - 'src-tauri/resources/ui/physical_lab_utube_experiment.py'
      - 'src-tauri/resources/ui/physical_lab_utube_experiment_ui.py'
      - 'src-tauri/resources/ui/physical_lab_utube_sweep_adapter.py'
      - 'src-tauri/resources/ui/physical_lab_result_contracts.py'
      - 'src-tauri/resources/ui/physical_lab_result_inspector.py'
      - 'scripts/utube_visualization_validation.py'
      - 'scripts/utube_coordinated_views_validation.py'
      - '.github/workflows/utube-visualization-integrity.yml'
  pull_request:
    paths:
      - 'src-tauri/resources/ui/physical_lab_utube_experiment.py'
      - 'src-tauri/resources/ui/physical_lab_utube_experiment_ui.py'
      - 'src-tauri/resources/ui/physical_lab_utube_sweep_adapter.py'
      - 'src-tauri/resources/ui/physical_lab_result_contracts.py'
      - 'src-tauri/resources/ui/physical_lab_result_inspector.py'
      - 'scripts/utube_visualization_validation.py'
      - 'scripts/utube_coordinated_views_validation.py'
      - '.github/workflows/utube-visualization-integrity.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install scientific dependencies
        run: python -m pip install numpy scipy pandas plotly
      - name: Compile bundled U-tube and contract code
        run: |
          python -m py_compile src-tauri/resources/ui/physical_lab_utube_experiment_ui.py
          python -m py_compile src-tauri/resources/ui/physical_lab_result_contracts.py
          python -m py_compile scripts/utube_visualization_validation.py
          python -m py_compile scripts/utube_coordinated_views_validation.py
      - name: Validate U-tube visualization and Result Inspector integration
        run: python scripts/utube_visualization_validation.py
      - name: Validate coordinated U-tube views
        run: python scripts/utube_coordinated_views_validation.py
      - name: Verify UI integration boundaries
        run: |
          grep -q 'Physical View' src-tauri/resources/ui/physical_lab_utube_experiment_ui.py
          grep -q 'Threshold Map' src-tauri/resources/ui/physical_lab_utube_experiment_ui.py
          grep -q 'Capacity anatomy' src-tauri/resources/ui/physical_lab_utube_experiment_ui.py
          grep -q 'not experimental observations' src-tauri/resources/ui/physical_lab_utube_experiment_ui.py
          grep -q 'engineering-lab-utube-sweep-result/v1' src-tauri/resources/ui/physical_lab_result_contracts.py
