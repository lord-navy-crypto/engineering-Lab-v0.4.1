name: Engineering Lab Visual Analytics Integrity

on:
  workflow_dispatch:
  push:
    branches:
      - feature/expand-physics-simulation-scenarios
    paths:
      - 'src-tauri/resources/ui/physical_lab_visual_analytics.py'
      - 'src-tauri/resources/ui/physical_lab_visual_analytics_ui.py'
      - 'src-tauri/resources/ui/physical_lab_project_interop_ui.py'
      - 'src-tauri/tauri.conf.json'
      - 'scripts/visual_analytics_validation.py'
      - '.github/workflows/visual-analytics-integrity.yml'
  pull_request:
    paths:
      - 'src-tauri/resources/ui/physical_lab_visual_analytics.py'
      - 'src-tauri/resources/ui/physical_lab_visual_analytics_ui.py'
      - 'src-tauri/resources/ui/physical_lab_project_interop_ui.py'
      - 'src-tauri/tauri.conf.json'
      - 'scripts/visual_analytics_validation.py'
      - '.github/workflows/visual-analytics-integrity.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install analytics dependencies
        run: python -m pip install pandas plotly
      - name: Compile Visual Analytics modules
        run: |
          python -m py_compile src-tauri/resources/ui/physical_lab_visual_analytics.py
          python -m py_compile src-tauri/resources/ui/physical_lab_visual_analytics_ui.py
          python -m py_compile src-tauri/resources/ui/physical_lab_project_interop_ui.py
          python -m py_compile scripts/visual_analytics_validation.py
      - name: Validate uncertainty overlay selection and dashboards
        run: python scripts/visual_analytics_validation.py
      - name: Verify application integration
        run: |
          grep -q 'Visual Analytics' src-tauri/resources/ui/physical_lab_project_interop_ui.py
          grep -q 'physical_lab_visual_analytics.py' src-tauri/tauri.conf.json
          grep -q 'physical_lab_visual_analytics_ui.py' src-tauri/tauri.conf.json
          grep -q 'visual-analytics-dashboards' src-tauri/resources/ui/physical_lab_visual_analytics.py
          grep -q 'changes representation and selection, not evidence' src-tauri/resources/ui/physical_lab_visual_analytics.py
